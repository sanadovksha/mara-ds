name: Validate component coverage

on:
  pull_request:
    paths:
      - "components/**"
      - "scripts/validate_components.py"
      - ".github/workflows/validate-components.yml"
  push:
    branches: [main]
    paths:
      - "components/**"
      - "scripts/validate_components.py"
      - ".github/workflows/validate-components.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_components.py
